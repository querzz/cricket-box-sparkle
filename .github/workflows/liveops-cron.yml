name: CRICKET BOX LiveOps Scheduler

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger LiveOps tick
        env:
          APP_URL: ${{ secrets.CRICKET_BOX_APP_URL }}
          LIVEOPS_CRON_SECRET: ${{ secrets.LIVEOPS_CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$APP_URL" ] || [ -z "$LIVEOPS_CRON_SECRET" ]; then
            echo "LiveOps scheduler is not configured: set CRICKET_BOX_APP_URL and LIVEOPS_CRON_SECRET repository secrets."
            echo "Skipping tick instead of failing the scheduled workflow."
            exit 0
          fi

          response="$(curl --fail-with-body --silent --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            -X POST \
            -H "Authorization: Bearer $LIVEOPS_CRON_SECRET" \
            -H "Accept: application/json" \
            "$APP_URL/api/internal/liveops/tick")"
          printf '%s\n' "$response"
