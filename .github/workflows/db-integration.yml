name: CRICKET BOX PostgreSQL Integration

on:
  workflow_dispatch:

# Keep the queue focused on the newest main revision.
concurrency:
  group: cricket-box-db-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    name: PostgreSQL invariants, LiveOps & concurrency
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cricket
          POSTGRES_PASSWORD: cricket
          POSTGRES_DB: cricket_box_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U cricket -d cricket_box_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: postgresql://cricket:cricket@localhost:5432/cricket_box_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build production bundle
        run: npm run build

      - name: Run product static QA
        run: npm run test:product-qa

      - name: Apply database schema
        run: node scripts/init-db.mjs

      - name: Run PostgreSQL integration tests
        run: npm run test:db

      - name: Run LiveOps lifecycle regression tests
        run: npm run test:liveops

      - name: Run spin idempotency regression tests
        run: npm run test:spin-idempotency

      - name: Run prize probability regression tests
        run: npm run test:prize-probabilities
