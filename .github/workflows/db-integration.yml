name: CRICKET BOX PostgreSQL Integration

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  integration:
    name: PostgreSQL invariants & concurrency
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cricket
          POSTGRES_PASSWORD: cricket
          POSTGRES_DB: cricket_box_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U cricket -d cricket_box_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: postgresql://cricket:cricket@localhost:5432/cricket_box_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply database schema
        run: node scripts/init-db.mjs

      - name: Run PostgreSQL integration tests
        run: npm run test:db
